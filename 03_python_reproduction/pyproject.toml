[project]
name = "passive-rfid-temperature-sensing"
version = "1.0.0"
description = "From-scratch passive RFID temperature-sensing experiments"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "numpy==2.3.5",
    "pandas==3.0.1",
    "scipy==1.18.0",
    "torch==2.13.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"
